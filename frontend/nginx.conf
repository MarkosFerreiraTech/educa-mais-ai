# SPA do Educa Mais: fallback para index.html e proxy /api -> API Spring.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Seguranca (CSP alinhada ao backend: sem inline script de terceiros)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome: cache longo
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy para a API: resolucao em RUNTIME via DNS embutido do Docker.
    # Com proxy_pass "estatico" (http://api:8080), o nginx resolve o hostname
    # na inicializacao e morre com
    #   [emerg] host not found in upstream "api"
    # se o container da API ainda nao estiver no ar (ou crashar). Com resolver
    # + variavel, o nginx sobe mesmo assim e responde 502 ate a API ficar saudavel.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
