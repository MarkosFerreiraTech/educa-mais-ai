# ============================================================================
# Educa Mais - Web (Angular SPA servida pelo nginx)
# ----------------------------------------------------------------------------
# Este arquivo substitui /etc/nginx/nginx.conf INTEIRO (contexto `main`), e nao
# apenas um server block em conf.d. Motivo: o container roda como usuario
# nao-root (`web`), e o nginx.conf padrao da imagem escreve o PID em
# /var/run/nginx.pid e escuta na porta 80 — as duas coisas exigem root.
# Com esta configuracao o nginx sobe sem privilegios: PID e temporarios em
# /tmp, porta 8080 e logs em stdout/stderr (capturados por `docker compose logs`).
# ============================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs em stdout para aparecerem em `docker compose logs web`.
    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Temporarios gravaveis pelo usuario nao-root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Seguranca (alinhada ao backend: sem scripts de terceiros)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Assets com hash no nome: cache longo
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Proxy para a API: resolucao em RUNTIME via DNS embutido do Docker.
        # Com proxy_pass "estatico" (http://api:8080), o nginx resolve o hostname
        # na inicializacao e morre com
        #   [emerg] host not found in upstream "api"
        # se o container da API ainda nao estiver no ar (ou crashar). Com resolver
        # + variavel, o nginx sobe mesmo assim e responde 502 ate a API ficar saudavel.
        # O frontend chama /api/v1/... (environment.prod.ts: apiUrl = '/api/v1').
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 5s;
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Erros da API sao JSON (ApiError): nao interceptar para pagina do nginx.
            proxy_intercept_errors off;
            proxy_read_timeout 60s;
        }

        # Healthcheck do Dockerfile/compose
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }
    }
}
