spring:
  datasource:
    url: jdbc:h2:mem:educamais_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/h2

educamais:
  security:
    jwt:
      secret: integration-test-secret-with-32-characters-min!!
      issuer: educa-mais-test
      audience: educa-mais-test-web
    encryption-key: 0123456789abcdef0123456789abcdef
    cors-allowed-origins: http://localhost:4200
    webhook:
      api-key: test-api-key
      hmac-secret: test-hmac-secret
      tolerance-seconds: 300
    authelia:
      enabled: false
  agent:
    llm-enabled: false
    gemini-api-key: ""
    max-steps: 5
  whatsapp:
    provider: DEMO

logging:
  level:
    root: WARN
    br.com.educamais: INFO
