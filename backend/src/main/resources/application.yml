# ============================================================
# Educa Mais API - configuracao base (12-factor: tudo por env)
# ============================================================
spring:
  application:
    name: educa-mais-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educamais}
    username: ${DB_USER:educamais}
    password: ${DB_PASSWORD:educamais}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      # Desligado: o contrato de erro do Educa Mais e o ApiError (RF36), tratado em
      # ApiExceptionHandler; o ProblemDetail padrao nao deve competir com ele.
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: educa-mais-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ---------------------- Configuracao do projeto ----------------------
educamais:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-key-with-at-least-32-chars!!}
      issuer: ${JWT_ISSUER:educa-mais-api}
      audience: ${JWT_AUDIENCE:educa-mais-web}
      access-token-minutes: ${JWT_ACCESS_MINUTES:60}
      refresh-token-days: ${JWT_REFRESH_DAYS:7}
    encryption-key: ${ENCRYPTION_KEY:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    webhook:
      api-key: ${SCHOOL_API_KEY:demo-school-api-key}
      hmac-secret: ${SCHOOL_HMAC_SECRET:demo-hmac-secret-change-me}
      tolerance-seconds: ${SCHOOL_HMAC_TOLERANCE:300}
    authelia:
      enabled: ${AUTHELIA_ENABLED:false}
      issuer-uri: ${AUTHELIA_ISSUER:https://auth.educa-mais.local}
      client-id: ${AUTHELIA_CLIENT_ID:educa-mais}
      client-secret: ${AUTHELIA_CLIENT_SECRET:}
      professor-group: ${AUTHELIA_PROFESSOR_GROUP:professores}
      admin-group: ${AUTHELIA_ADMIN_GROUP:administradores}
  agent:
    llm-enabled: ${GEMINI_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT:20}
    max-steps: ${AGENT_MAX_STEPS:5}
    max-attempts-per-step: ${AGENT_MAX_ATTEMPTS_STEP:3}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:DEMO}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    evolution-base-url: ${EVOLUTION_BASE_URL:}
    evolution-api-key: ${EVOLUTION_API_KEY:}
    evolution-instance: ${EVOLUTION_INSTANCE:educa-mais}
    mission-deep-link-base: ${MISSION_DEEP_LINK:http://localhost:4200/aluno/missoes}

logging:
  level:
    root: INFO
    br.com.educamais: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
