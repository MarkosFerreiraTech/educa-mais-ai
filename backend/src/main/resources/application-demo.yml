# Perfil de demonstracao: Postgres do Docker Compose + dados de exemplo + agente em modo demo.
#
# IMPORTANTE: um resource profile-specific (como este) NAO pode declarar
# spring.profiles.include/active. Desde o Spring Boot 2.4 o boot falha com:
#   InvalidConfigDataPropertyException: Property 'spring.profiles.include'
#   imported from location 'class path resource [application-demo.yml]' is invalid
#
# Foi exatamente essa heranca (include: dev) que causava o crash do Docker Compose:
# o `dev` fixa driver-class-name: org.h2.Driver, entao a API subia com a URL do
# Postgres e o driver do H2 e morria antes do healthcheck:
#   Failed to determine a suitable driver class  ->  container educa-mais-api exited (1)
#
# O demo e autocontido e NAO inclui o perfil dev. Para rodar localmente sem
# Docker, use SPRING_PROFILES_ACTIVE=dev (H2 em memoria).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educamais}
    username: ${DB_USER:educamais}
    password: ${DB_PASSWORD:educamais}
    # Driver fixado explicitamente (o Postgres esta no classpath); sem pin, a
    # deteccao pelo URL tambem funciona, mas o pin e deterministico.
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # O esquema vem das migrations do Flyway; nada e criado por engenharia reversa.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

educamais:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  agent:
    llm-enabled: ${GEMINI_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:DEMO}

logging:
  level:
    br.com.educamais: ${LOG_LEVEL:INFO}
