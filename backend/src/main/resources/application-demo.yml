# Perfil de demonstracao: Postgres do Docker Compose + dados de exemplo + agente em modo demo.
#
# IMPORTANTE: um resource profile-specific (como este) NAO pode declarar
# spring.profiles.include/active. Desde o Spring Boot 2.4 o boot falha no
# ambiente com:
#   InvalidConfigDataPropertyException: Property 'spring.profiles.include'
#   imported from location 'class path resource [application-demo.yml]' is invalid
# Por isso o demo e autocontido e NAO inclui o perfil dev (que usa H2 em
# memoria). Para rodar localmente sem Docker, use SPRING_PROFILES_ACTIVE=dev.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educamais}
    username: ${DB_USER:educamais}
    password: ${DB_PASSWORD:educamais}
    # Driver fixado explicitamente (o Postgres esta no classpath); sem pin, a
    # deteccao pelo URL tambem funciona, mas o pin e determinístico em qualquer
    # combinacao de perfis.
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

educamais:
  agent:
    llm-enabled: ${GEMINI_ENABLED:false}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:DEMO}
