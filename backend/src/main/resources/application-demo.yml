# Perfil de demonstracao: Postgres (Docker Compose) + dados de exemplo + agente em modo demo.
#
# ATENCAO: este perfil NAO inclui o perfil `dev`.
# O `dev` aponta para H2 em memoria e fixa `driver-class-name: org.h2.Driver`. Quando o demo
# herdava o dev (`spring.profiles.include: dev`) e ao mesmo tempo recebia uma URL PostgreSQL
# pelo Docker Compose, a API subia com a URL do Postgres e o driver do H2 e morria no startup:
#
#   Failed to determine a suitable driver class
#   ... container educa-mais-api exited (1)
#
# Por isso tudo o que o demo precisa esta declarado aqui, de forma explicita.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/educamais}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:educamais}
    password: ${DB_PASSWORD:educamais}
  jpa:
    hibernate:
      # O esquema vem das migrations do Flyway; nada e criado por engenharia reversa.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

educamais:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  agent:
    llm-enabled: ${GEMINI_ENABLED:false}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:DEMO}

logging:
  level:
    br.com.educamais: ${LOG_LEVEL:INFO}
