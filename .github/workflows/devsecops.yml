name: DevSecOps

# RNF17-RNF21: analise de dependencias (OWASP Dependency-Check), segredos (Gitleaks)
# e containers (Trivy). Roda em push/PR e semanalmente (base de vulnerabilidades).
on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar segredos versionados
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: Dependencias (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache da base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('backend/pom.xml') }}
      - name: Escanear dependencias do backend
        working-directory: backend
        continue-on-error: true
        run: |
          ./mvnw -B -ntp org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=../security/dependency-check-suppressions.xml \
            -Dformat=HTML,SARIF
      - name: Publicar relatorio no GitHub Security
        if: always() && hashFiles('backend/target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/target/dependency-check-report.sarif
          category: owasp-dependency-check
      - name: Publicar relatorio HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14
          if-no-files-found: ignore

  trivy:
    name: Imagem (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da API
        run: docker build -t educa-mais-api:${{ github.sha }} ./backend
      - name: Escanear imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: educa-mais-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Publicar resultados no GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
      - name: Falhar em vulnerabilidades criticas
        run: |
          CRITICAL=$(jq '[.runs[].results[]? | select(.level == "error")] | length' trivy-results.sarif)
          echo "Achados criticos/altos: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error title=Trivy::imagem com $CRITICAL vulnerabilidades criticas/altas corrigiveis"
          fi
