name: Backend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'arena/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Testes + Cobertura (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes com cobertura
        id: build
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B -ntp -Dstyle.color=never verify 2>&1 | tee ../build.log

      - name: Publicar diagnosticos no resumo (falha)
        if: failure()
        run: |
          echo "### Diagnostico do build" >> "$GITHUB_STEP_SUMMARY"
          grep -E "ERROR|error:|BUILD FAILURE|Tests run|FAILURE" build.log | head -120 >> "$GITHUB_STEP_SUMMARY"
          grep -E "ERROR|error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Maven::${line:0:900}"
          done

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            echo "### Cobertura JaCoCo" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {
              printf "- Instrucoes: %.1f%%\n", 100*ic/(im+ic);
              printf "- Branches: %.1f%%\n", 100*bc/(bm+bc);
            }' backend/target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

  quality-gate:
    name: Quality Gate (SonarQube)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache do SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - name: Analise SonarQube
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        working-directory: backend
        run: |
          mvn -B -ntp verify sonar:sonar \
            -Dsonar.projectKey=educa-mais-api \
            -Dsonar.qualitygate.wait=true
      - name: Quality Gate indisponivel (sem SONAR_TOKEN)
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN nao configurado - gate coberto por JaCoCo (60% linhas) + ArchUnit + Checkstyle"
