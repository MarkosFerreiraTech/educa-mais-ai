name: Backend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'arena/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Testes + Cobertura (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes com cobertura
        id: build
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B -ntp -Dstyle.color=never verify 2>&1 | tee ../build.log

      - name: Publicar diagnosticos (resumo + annotations)
        if: failure()
        run: |
          {
            echo "### Resumo do build (ultimas 60 linhas)"
            tail -60 build.log
            echo ""
            echo "### Relatorios de teste"
            for report in backend/target/surefire-reports/*.txt backend/target/failsafe-reports/*.txt; do
              [ -f "$report" ] || continue
              echo "--- $(basename "$report")"
              head -40 "$report"
            done
            echo ""
            echo "### Log de runtime dos testes"
            tail -60 backend/target/test-server.log 2>/dev/null || echo "(sem log)"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          # ---------------------------------------------------------- annotations
          # 1) teste a teste, com a mensagem da falha (XML do surefire/failsafe)
          python3 scripts/ci-annotations.py || true

          # 2) erros de compilacao
          grep -E "^\[ERROR\].*(error:|\.java:\[|cannot find symbol|COMPILATION ERROR)" build.log \
            | head -8 | cut -c1-380 | while IFS= read -r line; do
              echo "::error title=Compilacao::${line}"
            done

          # 3) falhas de contexto/runtime (bean, migration, schema)
          grep -hE "Caused by:|Schema-validation|Migration V|BeanCreationException|UNEXPECTED_ERROR|ATTENDANCE_EVENT_FAILED|VALIDATION_ERROR|AGENT_PLAN|REQUEST_INVALID" \
            backend/target/test-server.log backend/target/failsafe-reports/*.txt \
            backend/target/surefire-reports/*.txt 2>/dev/null \
            | head -8 | cut -c1-380 | while IFS= read -r line; do
              echo "::error title=Runtime::${line}"
            done

      - name: Diagnostico de runtime (erros 500)
        if: failure()
        run: |
          LOG=backend/target/test-server.log
          if [ ! -f "$LOG" ]; then
            echo "::warning title=Runtime::test-server.log nao gerado"
            exit 0
          fi
          # Sequencia de linhas do log (sem stacktrace completo), quebrada em blocos legiveis
          grep -nE "UNEXPECTED_ERROR|Exception|Caused by" "$LOG" | tail -12 | cut -c1-380 | nl -w2 -s': ' \
            | while IFS= read -r line; do
                echo "::error title=Runtime::${line}"
              done
          echo "### Ultimas linhas do log de testes" >> "$GITHUB_STEP_SUMMARY"
          tail -40 "$LOG" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico de cobertura (annotations)
        if: always()
        run: |
          CSV=backend/target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "::error title=Cobertura::jacoco.csv nao gerado"
            exit 0
          fi
          TOTAL=$(awk -F, 'NR>1 {im+=$4; ic+=$5; lm+=$8; lc+=$9} END {printf "instrucoes %.1f%% | linhas %.1f%%", 100*ic/(im+ic), 100*lc/(lm+lc)}' "$CSV")
          echo "::notice title=Cobertura total::${TOTAL}"
          echo "### Cobertura total: ${TOTAL}" >> "$GITHUB_STEP_SUMMARY"
          # 12 classes com menor cobertura de linhas (exclui DTOs/entidades/config ja ignorados no gate)
          awk -F, 'NR>1 && $9>0 {pct=100*$9/($8+$9); printf "%.1f%%\t%s.%s\n", pct, $2, $3}' "$CSV" \
            | sort -n | head -12 | while IFS=$'\t' read -r pct cls; do
                echo "::warning title=Cobertura ${pct}::${cls}"
              done

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/test-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            echo "### Cobertura JaCoCo" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {
              printf "- Instrucoes: %.1f%%\n", 100*ic/(im+ic);
              printf "- Branches: %.1f%%\n", 100*bc/(bm+bc);
            }' backend/target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

  quality-gate:
    name: Quality Gate (SonarQube)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache do SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - name: Analise SonarQube
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: |
          mvn -B -ntp verify sonar:sonar \
            -Dsonar.projectKey=educa-mais-api \
            -Dsonar.qualitygate.wait=true
      - name: Quality Gate indisponivel (sem SONAR_TOKEN)
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN nao configurado - gate coberto por JaCoCo (60% linhas) + ArchUnit + Checkstyle"
