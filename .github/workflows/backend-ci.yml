name: Backend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'arena/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Testes + Cobertura (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: educamais_test
          POSTGRES_USER: educamais
          POSTGRES_PASSWORD: educamais
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar estilo (Checkstyle)
        working-directory: backend
        run: mvn -B -ntp checkstyle:checkstyle -Dcheckstyle.config.location=config/checkstyle.xml || true

      - name: Compilar e executar testes com cobertura
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/educamais_test
          DB_USER: educamais
          DB_PASSWORD: educamais
        run: mvn -B -ntp verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f backend/target/site/jacoco/jacoco.csv ]; then
            echo "### Cobertura JaCoCo" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {
              printf "- Instrucoes: %.1f%%\n", 100*ic/(im+ic);
              printf "- Branches: %.1f%%\n", 100*bc/(bm+bc);
            }' backend/target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

  quality-gate:
    name: Quality Gate (SonarQube)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache do SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - name: Analise SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        working-directory: backend
        run: |
          mvn -B -ntp verify sonar:sonar \
            -DskipTests=false \
            -Dsonar.projectKey=educa-mais-api \
            -Dsonar.qualitygate.wait=true
      - name: Quality Gate indisponivel (sem SONAR_TOKEN)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN nao configurado - gate substituido por cobertura minima + ArchUnit"
